<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Project - Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="header">
        <h3 class="todoHeading">TODO LIST</h3>
      </div>
      <div class="middle">
        <div class="inputSearch">
          <input type="text" placeholder="Add a new Task" />
          <button>Add Task</button>
        </div>
      </div>
      <div class="footer">
        <ul class="taskList">
          <li class="taskItem">
            Task 1
            <button>Delete</button>
          </li>
          <li class="taskItem">
            Task 2
            <button>Delete</button>
          </li>
          <li class="taskItem">
            Task 3
            <button>Delete</button>
          </li>
        </ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
